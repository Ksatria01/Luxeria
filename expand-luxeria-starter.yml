name: Expand Luxeria Web Starter

on:
  workflow_dispatch:
  push:
    paths:
      - 'Luxeria-Web-Starter.zip'
      - '.github/workflows/expand-luxeria-starter.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract starter into repository root
        run: |
          set -euo pipefail
          ARCHIVE="Luxeria-Web-Starter.zip"
          test -f "$ARCHIVE" || { echo "Missing $ARCHIVE in repository root"; exit 1; }
          mkdir -p .luxeria-extract
          unzip -q "$ARCHIVE" -d .luxeria-extract
          SOURCE=".luxeria-extract/Luxeria-Web"
          test -d "$SOURCE" || { echo "Expected folder Luxeria-Web was not found in ZIP"; exit 1; }
          cp -a "$SOURCE"/. .
          rm -rf .luxeria-extract "$ARCHIVE"

      - name: Commit expanded website source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Install Luxeria Web Starter source"
            git push
          fi
